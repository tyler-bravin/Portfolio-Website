<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Terminal prompt mark: chevron + block cursor.
    Adapts to the browser's colour scheme automatically; the .ico
    fallbacks are swapped by the site's own theme toggle instead.
  -->
  <style>
    .bg      { fill: #f5f4f0; }
    .chevron { stroke: #c37000; }
    .cursor  { fill: #1a1a1e; }
    @media (prefers-color-scheme: dark) {
      .bg      { fill: #0e0e11; }
      .chevron { stroke: #ffb454; }
      .cursor  { fill: #edebe6; }
    }
  </style>
  <rect class="bg" width="512" height="512" rx="112" />
  <path class="chevron" d="M123 154 L235 256 L123 358" fill="none" stroke-width="59" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="cursor" x="287" y="287" width="102" height="71" />
</svg>
